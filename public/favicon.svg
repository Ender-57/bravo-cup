<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF"/>
      <stop offset="50%" stop-color="#007DCC"/>
      <stop offset="100%" stop-color="#004D80"/>
    </linearGradient>
    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gripGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="corkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Racket Shaft -->
    <line x1="28" y1="36" x2="14" y2="50" stroke="url(#shaftGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="28" y1="36" x2="14" y2="50" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round"/>

    <!-- T-Joint -->
    <path d="M26.5 34.5 L29.5 37.5" stroke="#007DCC" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Grip Handle -->
    <line x1="15" y1="49" x2="7" y2="57" stroke="url(#gripGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Grip Wraps -->
    <line x1="14" y1="48" x2="12" y2="50" stroke="#00A3FF" stroke-width="1.5"/>
    <line x1="11" y1="51" x2="9" y2="53" stroke="#00A3FF" stroke-width="1.5"/>
    <!-- End Cap -->
    <circle cx="6" cy="58" r="2.5" fill="#007DCC"/>

    <!-- Racket Head Rim -->
    <ellipse cx="40" cy="24" rx="15" ry="17" transform="rotate(-45 40 24)" fill="#FFFFFF" fill-opacity="0.15" stroke="url(#frameGrad)" stroke-width="3.5"/>

    <!-- String Grid (Pattern) -->
    <!-- Vertical-ish strings -->
    <path d="M30 14 L50 34" stroke="#94A3B8" stroke-width="0.8" opacity="0.75"/>
    <path d="M27 20 L47 40" stroke="#94A3B8" stroke-width="0.8" opacity="0.75"/>
    <path d="M33 11 L53 31" stroke="#94A3B8" stroke-width="0.8" opacity="0.75"/>
    <path d="M24 23 L44 43" stroke="#94A3B8" stroke-width="0.8" opacity="0.75"/>
    
    <!-- Horizontal-ish strings -->
    <path d="M34 39 L49 20" stroke="#94A3B8" stroke-width="0.8" opacity="0.75"/>
    <path d="M29 33 L45 13" stroke="#94A3B8" stroke-width="0.8" opacity="0.75"/>
    <path d="M39 44 L54 26" stroke="#94A3B8" stroke-width="0.8" opacity="0.75"/>
    <path d="M24 27 L40 7" stroke="#94A3B8" stroke-width="0.8" opacity="0.75"/>

    <!-- Shuttlecock -->
    <g transform="translate(18, 12) rotate(-20)">
      <!-- Feathers -->
      <path d="M0 8 L12 0 L14 4 L5 12 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.75"/>
      <path d="M4 11 L16 3 L18 7 L9 15 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.75"/>
      <path d="M8 14 L20 6 L21 10 L13 18 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.75"/>
      <!-- Feather Ribbons -->
      <path d="M6 8 Q 11 11, 16 7" stroke="#007DCC" stroke-width="1" fill="none"/>
      <!-- Cork / Base -->
      <circle cx="2" cy="11" r="3.5" fill="url(#corkGrad)" stroke="#B45309" stroke-width="0.75"/>
    </g>
  </g>
</svg>
